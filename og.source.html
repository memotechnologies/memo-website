<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500;1,8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:      #eef1ef;
    --paper-warm: #dfeae4;
    --ink:        #131c18;
    --ink-soft:   #4f5a54;
    --ink-mute:   #5c6861;
    --accent:     #0f5a41;
    --accent-deep: #0e3b2e;
    --serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --sans:  'Inter', -apple-system, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Paper behind the card too, so a capture that overshoots the 630px by a
     pixel or two bleeds the canvas rather than a white strip. */
  html { background: var(--paper); }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: var(--paper);
    padding: 74px 96px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  /* Faint green wash, centre-right — kept well under the old rust bloom so the
     card reads as flat paper rather than an ambient glow. */
  .glow {
    position: absolute;
    width: 760px; height: 760px;
    top: -130px; right: 40px;
    background: radial-gradient(circle, rgba(15, 90, 65, 0.07) 0%, rgba(15, 90, 65, 0.03) 34%, rgba(15, 90, 65, 0) 68%);
    pointer-events: none;
  }

  .mark {
    width: 96px; height: 96px;
    border-radius: 7px;
    background: var(--accent-deep);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 62px;
    color: var(--paper);
    line-height: 1;
  }

  .hed {
    font-family: var(--serif);
    font-size: 64px;
    line-height: 1.1;
    letter-spacing: -0.018em;
    color: var(--ink);
    font-weight: 600;
    /* Caps the measure so each of the two clauses keeps its own line. */
    max-width: 880px;
  }
  .hed em {
    display: block;
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }

  /* Serif, like the hed above it and like the deck on the page itself.
     It is a sentence, and sentences are serif here — only the wordmark
     footer below stays in the label face. */
  .deck {
    font-family: var(--serif);
    font-size: 28px;
    line-height: 1.45;
    color: var(--ink-soft);
    max-width: 900px;
    margin-top: 26px;
  }

  .foot {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .stack { position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow" aria-hidden="true"></div>

    <div class="stack"><div class="mark">M</div></div>

    <div class="stack">
      <h1 class="hed">
        Your AI sales worker.
        <em>It doesn&rsquo;t wait to be asked.</em>
      </h1>
      <p class="deck">
        It notices what a deal needs, then drafts the CRM update, the reply and the next meeting. You approve in one tap.
      </p>
    </div>

    <div class="stack foot">sentmemo.com</div>
  </div>
</body>
</html>
